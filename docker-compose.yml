version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notemind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notemind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notemind"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
