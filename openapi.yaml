openapi: 3.0.3
info:
  title: NoteMind API
  description: Productive AI-assisted notes and knowledge-base REST API with pgvector RAG pipeline.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /auth/signup:
    post:
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@notemind.ai
                password:
                  type: string
                  minLength: 6
                  example: SecretP@ss123
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      summary: Authenticate user credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/update-password:
    put:
      summary: Update user password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /collections:
    get:
      summary: List user collections
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
    post:
      summary: Create a new collection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Internship Project
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Collection'

  /collections/{id}:
    get:
      summary: Get collection by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Collection details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Collection'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update a collection
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Collection updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Collection'

    delete:
      summary: Delete a collection
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Collection deleted

  /notes:
    get:
      summary: List notes with optional collection filter & cursor pagination
      security:
        - BearerAuth: []
      parameters:
        - name: collectionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated list of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  pagination:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                      hasMore:
                        type: boolean

    post:
      summary: Create a new note
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                collectionId:
                  type: string
                  format: uuid
                  nullable: true
                title:
                  type: string
                content:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Note'

  /notes/index:
    post:
      summary: Explicitly index notes for AI search (⚡ Index button)
      description: >
        Embeds the selected notes so /rag/ask can retrieve them. Only indexed
        notes are ever searched. Notes whose stored chunk hashes already match
        their current content are skipped (status up_to_date) and consume no
        API quota. Editing a note drops its index on the server side.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - noteIds
              properties:
                noteIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                force:
                  type: boolean
                  default: false
                  description: Re-embed even when the stored hashes already match.
      responses:
        '200':
          description: Per-note indexing results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            noteId:
                              type: string
                            title:
                              type: string
                              nullable: true
                            status:
                              type: string
                              enum: [indexed, up_to_date, failed, not_found, trashed]
                            chunks:
                              type: integer
                            error:
                              type: string
                      summary:
                        type: object
                        properties:
                          requested:
                            type: integer
                          indexed:
                            type: integer
                          upToDate:
                            type: integer
                          failed:
                            type: integer
        '503':
          description: No embedding provider configured (missing GEMINI_API_KEY)

  /notes/{id}:
    get:
      summary: Get note by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Note'

    put:
      summary: Update a note
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionId:
                  type: string
                  format: uuid
                  nullable: true
                title:
                  type: string
                content:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Note updated

    delete:
      summary: Delete a note
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Note deleted

  /tags:
    get:
      summary: List user tags
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
    post:
      summary: Create a standalone tag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: TypeScript
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Tag'

  /tags/{id}:
    put:
      summary: Update a tag
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Tag'

    delete:
      summary: Delete a tag
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tag deleted

  /rag/ask:
    post:
      summary: Ask My Notes (Retrieval-Augmented Generation query)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  example: What database extension is used for RAG?
                topK:
                  type: integer
                  default: 3
                collectionIds:
                  type: array
                  maxItems: 50
                  description: Optional scope - only search notes inside these collections. Omitted or empty searches all indexed notes.
                  items:
                    type: string
                    format: uuid
                noteIds:
                  type: array
                  maxItems: 200
                  description: Optional fine-grained scope - only search these specific notes (the selection ticked in the Ask screen's AI Index panel). Omitted or empty searches all indexed notes.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: RAG query grounded response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  question:
                    type: string
                  answer:
                    type: string
                  retrievedNotes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        content:
                          type: string
                        collectionName:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        similarity:
                          type: number
                          description: Cosine similarity as a percentage (0-100)
                        snippet:
                          type: string
                          description: The matched passage from the note
                  sources:
                    type: array
                    description: Numbered passages that back the answer, in citation order
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        noteId:
                          type: string
                        title:
                          type: string
                        collectionName:
                          type: string
                        similarity:
                          type: number
                        chunkContent:
                          type: string
                  degraded:
                    type: boolean
                    description: True when no generation provider was available and the answer fell back to extractive mode

  /rag/ask/stream:
    post:
      summary: Stream an Ask My Notes answer
      description: Uses the same retrieval and response payload as /rag/ask, but sends Server-Sent Events so generated text appears as it is produced.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                topK:
                  type: integer
                  default: 3
                collectionIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                noteIds:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Server-Sent Events in meta, delta, optional restart, and done frames
          content:
            text/event-stream:
              schema:
                type: string
                example: |-
                  event: delta
                  data: {"text":"Your notes say..."}

                  event: done
                  data: {"question":"...","answer":"...","retrievedNotes":[],"sources":[],"degraded":false}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        indexed:
          type: boolean
          description: True when the note's AI embeddings are present and current for the active model.

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string

  responses:
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object

    UnauthorizedError:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized access
